all: false
dir: '{{.InterfaceDir}}'
filename: mocks_test.go
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    all-errors: false
    comments: true
    format-only: true
    fragment: false
    local-prefix: ""
    tab-indent: true
    tab-width: 8
generate: true
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: '{{.SrcPackageName}}'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  github.com/justenwalker/kevin/plugin:
    interfaces:
      Step:
      Downer:
      Exporter:
      ToolProvider:
  github.com/justenwalker/kevin/internal/command:
    interfaces:
      Runner:
        config:
          dir: internal/command/commandtest
          filename: mocks.go
          pkgname: commandtest
  github.com/justenwalker/kevin/internal/plugins/helm:
    interfaces:
      cli:
  github.com/justenwalker/kevin/internal/plugins/kubectl:
    interfaces:
      cli:
  github.com/justenwalker/kevin/internal/plugins/wait:
    interfaces:
      kubectlCLI:
  github.com/justenwalker/kevin/internal/plugins/kubernetes:
    interfaces:
      kindCLI:
