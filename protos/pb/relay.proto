syntax = "proto3";

package kevin.relay.v1;

option go_package = "github.com/justenwalker/kevin/protos/pb;pb";

import "pb/plugin.proto";

// RelayControl is the control channel between kevin's engine and one
// project's relay container. It is served over mutual TLS: only a caller
// holding a client certificate signed by the project's own intermediate
// authority can call it.
service RelayControl {
  // RegisterCapture tells the relay to redirect traffic through the
  // namespace at netns_path to itself, so egress is captured transparently
  // - regardless of whether a workload resolves the relay's own DNS or
  // honors a proxy environment variable. With no exclude_cidrs, netns_path
  // is a single workload's own namespace, captured at its own outbound
  // connections (a builtin:container step). With exclude_cidrs set,
  // netns_path routes traffic for others - a builtin:kubernetes node - and is
  // captured at what transits it instead, skipping any destination in
  // exclude_cidrs so pod-to-pod and pod-to-service traffic isn't touched.
  rpc RegisterCapture(RegisterCaptureRequest) returns (RegisterCaptureResponse);

  // SetIntercepts replaces the intercept routes that owner registered. For
  // each intercept it answers the relay's own DNS for host - exactly, or by
  // "*." wildcard, the same rule builtin:route itself applies - since a
  // workload with no network namespace the relay can capture (a kind pod)
  // has no other way to reach the interception; it also opens a listener for
  // each of ports beyond the relay's always-on 80 and 443, and re-applies
  // capture on every container RegisterCapture has already registered - so a
  // route declared after some containers already exist still reaches them.
  // A host or port that no owner's latest call names any more stops being
  // answered or listened on. An empty intercepts list removes everything
  // owner registered, and is not an error for an owner with nothing.
  rpc SetIntercepts(SetInterceptsRequest) returns (SetInterceptsResponse);

  // ApplyFault installs a netem qdisc on interface, inside the network
  // namespace at netns_path, that delays, drops, corrupts, duplicates,
  // and/or reorders packets on it, all at once, in a single qdisc. Re-applying
  // with the same id replaces the qdisc's parameters rather than stacking
  // a second one - unlike RegisterCapture, a fault is not implicitly moot
  // when a step goes away, since the namespace it targets usually belongs
  // to a different, still-running step. A caller must call ClearFault
  // explicitly to remove it.
  rpc ApplyFault(ApplyFaultRequest) returns (ApplyFaultResponse);

  // ClearFault removes the netem qdisc that an earlier ApplyFault with the
  // same id installed, restoring the interface's default qdisc. A no-op,
  // not an error, when id names no currently-applied fault - a step's
  // teardown always calls this, whether or not its last Up ever applied
  // one.
  rpc ClearFault(ClearFaultRequest) returns (ClearFaultResponse);
}

message RegisterCaptureRequest {
  // ID names the step (and, for a multi-node step, the node) this
  // namespace belongs to, for logging.
  string id = 1;

  // Netns is the namespace to capture. See the RegisterCapture RPC comment
  // for what its exclude_cidrs mean.
  kevin.plugin.v1.Netns netns = 2;
}

message RegisterCaptureResponse {}

message InterceptRoute {
  // Host is the real-world hostname an intercept route names.
  string host = 1;

  // Ports lists the ports a route's Intercept entry names, beyond the
  // relay's always-open 80 and 443.
  repeated int32 ports = 2;
}

message SetInterceptsRequest {
  // Owner names the step that registers these intercepts. A later call with
  // the same owner replaces them.
  string owner = 1;

  // Intercepts is everything owner intercepts now.
  repeated InterceptRoute intercepts = 2;
}

message SetInterceptsResponse {}

message ApplyFaultRequest {
  // Fault is the impairment to install. Its id keys the relay's own
  // bookkeeping for a later ClearFault.
  kevin.plugin.v1.NetworkFault fault = 1;
}

message ApplyFaultResponse {}

message ClearFaultRequest {
  // ID names the fault to remove, as passed to the ApplyFault call that
  // installed it.
  string id = 1;
}

message ClearFaultResponse {}
