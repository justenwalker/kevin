syntax = "proto3";

package kevin.relay.v1;

option go_package = "github.com/justenwalker/kevin/protos/pb;pb";

// RelayControl is the control channel between kevin's engine and one
// project's relay container. It is served over mutual TLS: only a caller
// holding a client certificate signed by the project's own intermediate
// authority can call it.
service RelayControl {
  // RegisterCapture tells the relay to redirect traffic through the
  // namespace at netns_path to itself, so egress is captured transparently
  // - regardless of whether a workload resolves the relay's own DNS or
  // honors a proxy environment variable. With no exclude_cidrs, netns_path
  // is a single workload's own namespace, captured at its own outbound
  // connections (a builtin:container step). With exclude_cidrs set,
  // netns_path routes traffic for others - a builtin:kind node - and is
  // captured at what transits it instead, skipping any destination in
  // exclude_cidrs so pod-to-pod and pod-to-service traffic isn't touched.
  rpc RegisterCapture(RegisterCaptureRequest) returns (RegisterCaptureResponse);

  // EnsureListener registers an intercept route: it answers the relay's own
  // DNS for host - exactly, or by "*." wildcard, the same rule builtin:route
  // itself applies - since a workload with no network namespace the relay
  // can capture (a kind pod) has no other way to reach the interception; it
  // also opens a listener for each of ports beyond the relay's always-on 80
  // and 443, and re-applies capture on every container RegisterCapture has
  // already registered - so a route declared after some containers already
  // exist still reaches them.
  rpc EnsureListener(EnsureListenerRequest) returns (EnsureListenerResponse);

  // ApplyFault installs a netem qdisc on interface, inside the network
  // namespace at netns_path, that delays, drops, corrupts, duplicates,
  // and/or reorders packets on it, all at once, in a single qdisc. Re-applying
  // with the same id replaces the qdisc's parameters rather than stacking
  // a second one - unlike RegisterCapture, a fault is not implicitly moot
  // when a step goes away, since the namespace it targets usually belongs
  // to a different, still-running step. A caller must call ClearFault
  // explicitly to remove it.
  rpc ApplyFault(ApplyFaultRequest) returns (ApplyFaultResponse);

  // ClearFault removes the netem qdisc that an earlier ApplyFault with the
  // same id installed, restoring the interface's default qdisc. A no-op,
  // not an error, when id names no currently-applied fault - a step's
  // teardown always calls this, whether or not its last Up ever applied
  // one.
  rpc ClearFault(ClearFaultRequest) returns (ClearFaultResponse);
}

message RegisterCaptureRequest {
  // ID names the step (and, for a multi-node step, the node) this
  // namespace belongs to, for logging.
  string id = 1;

  // NetnsPath is the host path of the network namespace, such as
  // "/var/run/docker/netns/1234abcd".
  string netns_path = 2;

  // ExcludeCIDRs lists destination CIDRs that must never be redirected to
  // the relay. See the RegisterCapture RPC comment for what its presence
  // means.
  repeated string exclude_cidrs = 3;
}

message RegisterCaptureResponse {}

message EnsureListenerRequest {
  // Host is the real-world hostname an intercept route names. Empty for a
  // step whose egress the relay already captures directly, which needs no
  // DNS answer of its own.
  string host = 1;

  // Ports lists the ports a route's Intercept entry names, beyond the
  // relay's always-open 80 and 443.
  repeated int32 ports = 2;
}

message EnsureListenerResponse {}

message ApplyFaultRequest {
  // ID names the step this fault belongs to, keying the relay's own
  // bookkeeping for a later ClearFault.
  string id = 1;

  // NetnsPath is the host path of the target network namespace, such as
  // "/proc/1234/ns/net".
  string netns_path = 2;

  // Interface is the network interface inside the namespace to attach the
  // netem qdisc to. Defaults to "eth0" when empty - kevin's own containers
  // are single-interface on the project's docker network.
  string interface = 3;

  // DelayMS is the fixed one-way delay added to every packet, in
  // milliseconds. 0 means no delay.
  int32 delay_ms = 4;

  // JitterMS is the random variation applied around delay_ms, in
  // milliseconds. Ignored when delay_ms is 0.
  int32 jitter_ms = 5;

  // LossPercent is the percentage of packets dropped, 0-100.
  double loss_percent = 6;

  // CorruptPercent is the percentage of packets corrupted (a single bit
  // flipped), 0-100.
  double corrupt_percent = 7;

  // DuplicatePercent is the percentage of packets duplicated, 0-100.
  double duplicate_percent = 8;

  // ReorderPercent is the percentage of packets reordered ahead of the
  // delay above, 0-100. Ignored when delay_ms is 0 - netem's own reorder
  // model only has meaning relative to a base delay.
  double reorder_percent = 9;
}

message ApplyFaultResponse {}

message ClearFaultRequest {
  // ID names the fault to remove, as passed to the ApplyFault call that
  // installed it.
  string id = 1;
}

message ClearFaultResponse {}
