syntax = "proto3";

package kevin.relay.v1;

option go_package = "github.com/justenwalker/kevin/protos/pb;pb";

// RelayControl is the control channel between kevin's engine and one
// project's relay container. It is served over mutual TLS: only a caller
// holding a client certificate signed by the project's own intermediate
// authority can call it.
service RelayControl {
  // RegisterCapture tells the relay to redirect the outbound traffic of the
  // container at netns_path to itself, so its egress is captured
  // transparently - regardless of whether the container resolves the
  // relay's own DNS or honors a proxy environment variable.
  rpc RegisterCapture(RegisterCaptureRequest) returns (RegisterCaptureResponse);

  // EnsureListener registers an External route: it answers the relay's own
  // DNS for host - exactly, or by "*." wildcard, the same rule builtin:route
  // itself applies - since a workload with no network namespace the relay
  // can capture (a kind pod) has no other way to reach the interception; it
  // also opens a listener for each of ports beyond the relay's always-on 80
  // and 443, and re-applies capture on every container RegisterCapture has
  // already registered - so a route declared after some containers already
  // exist still reaches them.
  rpc EnsureListener(EnsureListenerRequest) returns (EnsureListenerResponse);
}

message RegisterCaptureRequest {
  // ID names the step whose container this is, for logging.
  string id = 1;

  // NetnsPath is the host path of the container's network namespace, such
  // as "/var/run/docker/netns/1234abcd".
  string netns_path = 2;
}

message RegisterCaptureResponse {}

message EnsureListenerRequest {
  // Host is the real-world hostname an External route names. Empty for a
  // step whose egress the relay already captures directly, which needs no
  // DNS answer of its own.
  string host = 1;

  // Ports lists the ports a route's External entry names, beyond the
  // relay's always-open 80 and 443.
  repeated int32 ports = 2;
}

message EnsureListenerResponse {}
