apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-hooks
data:
  s3.sh: |
    #!/bin/sh
    set -e
    if ! php /var/www/html/occ status | grep -q "installed: true"; then
      php /var/www/html/occ maintenance:install \
        --database sqlite \
        --admin-user "$NEXTCLOUD_ADMIN_USER" \
        --admin-pass "$NEXTCLOUD_ADMIN_PASSWORD"
      php /var/www/html/occ config:system:set trusted_domains 1 --value="$NEXTCLOUD_TRUSTED_DOMAINS"
      php /var/www/html/occ app:enable files_external
      php /var/www/html/occ files_external:create "S3" amazons3 amazons3::accesskey \
        --config bucket=archive \
        --config hostname=s3.us-east-1.amazonaws.com \
        --config port=443 \
        --config region=us-east-1 \
        --config use_ssl=true \
        --config use_path_style=true \
        --config key=test \
        --config secret=test
    fi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      volumes:
        - name: kevin-ca
          hostPath:
            # written by kind's trust_ca step during "kevin setup"
            path: /usr/local/share/ca-certificates/kevin-root.crt
            type: File
        - name: hooks
          configMap:
            name: nextcloud-hooks
            defaultMode: 493
      containers:
        - name: nextcloud
          image: nextcloud:apache
          imagePullPolicy: IfNotPresent
          # A docker-entrypoint-hooks.d script (below) runs as the app's own
          # unprivileged user, same as every hook this image runs - too late
          # to trust a new CA system-wide. This container's own entrypoint
          # still starts as root, so the trust store update happens here
          # instead, before handing off to the image's real entrypoint.
          command: ["sh", "-c"]
          args:
            - |
              cp /etc/kevin/ca.crt /usr/local/share/ca-certificates/kevin.crt
              update-ca-certificates
              exec /entrypoint.sh apache2-foreground
          ports:
            - containerPort: 80
          env:
            - name: NEXTCLOUD_ADMIN_USER
              value: admin
            - name: NEXTCLOUD_ADMIN_PASSWORD
              value: admin
            # Read by the docker-entrypoint-hooks.d/before-starting script
            # below and applied there via "occ config:system:set" - the
            # script's own "occ maintenance:install" preempts the official
            # entrypoint's install path, which is what normally consumes
            # this env var, so nothing else ever sets trusted_domains.
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: nextcloud.kevin.home
          volumeMounts:
            - name: kevin-ca
              mountPath: /etc/kevin/ca.crt
              readOnly: true
            - name: hooks
              mountPath: /docker-entrypoint-hooks.d/before-starting
              readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
spec:
  selector:
    app: nextcloud
  ports:
    - port: 80
      targetPort: 80
